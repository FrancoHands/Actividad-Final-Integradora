<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de gastos personales</title>
  <link rel = "stylesheet" href = "styles.css">
</head>
<body>
  <header class = "banner">
    <h1>Calculadora de gastos personales</h1>
  </header>
  <nav class = "barraTareas">
    <a href="Gastos.html" class="boton">Gastos</a>
    <a href="NuevoRegistro.html" class="boton">Nuevo Registro</a>
    <a href="EditarRegistro.html" class="boton">Editar Registro</a>
  </nav>

  <!-- Selector de gasto -->

  <form class="formulario" id="formEditar">
    <label for="selectorGasto">Elegí un gasto</label>
    <select id="selectorGasto">
      <option value="">-- Seleccionar --</option>
    </select>

    <label for="conceptoEdit">Concepto</label>
    <input type="text" id="conceptoEdit" name="conceptoEdit">

    <label for="categoriaEdit">Categoría</label>
    <input type="text" id="categoriaEdit" name="categoriaEdit">

    <label for="montoEdit">Monto</label>
    <input type="number" id="montoEdit" name="montoEdit">

    <button type="button" id="btnActualizar">Actualizar</button>
    <button type="button" id="btnEliminar">Eliminar</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
