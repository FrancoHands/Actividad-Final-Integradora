<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar registro - Calculadora de gastos personales</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="banner">
    <h1>Calculadora de gastos personales</h1>
  </header>
  <nav class="barraTareas">
    <a href="index.html" class="boton">Gastos</a>
    <a href="NuevoRegistro.html" class="boton">Nuevo Registro</a>
    <a href="EditarRegistro.html" class="boton activo">Editar Registro</a>
  </nav>

  <main class="contenido">
    <h2>Editar o eliminar un gasto</h2>

    <form class="formulario" id="formEditar" novalidate>
      <label for="selectorGasto">Elegí un gasto</label>
      <select id="selectorGasto">
        <option value="">-- Seleccionar --</option>
      </select>

      <label for="conceptoEdit">Concepto</label>
      <input type="text" id="conceptoEdit" name="conceptoEdit">

      <label for="categoriaEdit">Categoría</label>
      <select id="categoriaEdit" name="categoriaEdit">
        <option value="">-- Seleccionar --</option>
      </select>

      <label for="montoEdit">Monto</label>
      <input type="number" id="montoEdit" name="montoEdit" min="0" step="0.01">

      <p class="mensaje" id="mensajeEditar"></p>

      <div class="botonesForm">
        <button type="submit" class="botonForm">Actualizar</button>
        <button type="button" class="botonForm" id="btnEliminar">Eliminar</button>
      </div>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
