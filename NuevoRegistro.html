<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo registro - Calculadora de gastos personales</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="banner">
    <h1>Calculadora de gastos personales</h1>
  </header>
  <nav class="barraTareas">
    <a href="index.html" class="boton">Gastos</a>
    <a href="NuevoRegistro.html" class="boton activo">Nuevo Registro</a>
    <a href="EditarRegistro.html" class="boton">Editar Registro</a>
  </nav>

  <main class="contenido">
    <h2>Nuevo gasto</h2>

    <form class="formulario" id="formNuevo" novalidate>
      <label for="concepto">Concepto</label>
      <input type="text" id="concepto" name="concepto" placeholder="Ej: Supermercado">

      <label for="categoria">Categoría</label>
      <select id="categoria" name="categoria">
        <option value="">-- Seleccionar --</option>
      </select>

      <label for="monto">Monto</label>
      <input type="number" id="monto" name="monto" min="0" step="0.01" placeholder="Ej: 1500">

      <p class="mensaje" id="mensajeNuevo"></p>

      <button type="submit" class="botonForm">Guardar</button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
