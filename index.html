<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de gastos personales</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="banner">
    <h1>Calculadora de gastos personales</h1>
  </header>
  <nav class="barraTareas">
    <a href="index.html" class="boton activo">Gastos</a>
    <a href="NuevoRegistro.html" class="boton">Nuevo Registro</a>
    <a href="EditarRegistro.html" class="boton">Editar Registro</a>
  </nav>

  <main class="contenido">
    <h2>Listado de gastos</h2>

    <div class="filtro">
      <label for="filtroCategoria">Filtrar por categoría</label>
      <select id="filtroCategoria">
        <option value="">Todas</option>
      </select>
    </div>

    <table class="tabla">
      <thead>
        <tr>
          <th>ID</th>
          <th>Concepto</th>
          <th>Categoría</th>
          <th>Monto</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <p class="total">Total: <span id="totalGastos">$ 0,00</span></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
